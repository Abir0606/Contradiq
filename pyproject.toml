[project]
name = "contractiq"
version = "0.1.0"
description = "Agentic RAG system for legal contract analysis on CUAD v1"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-pinecone>=0.2",
    "langchain-text-splitters>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-groq>=0.2",
    "sentence-transformers>=3.3",
    "pinecone>=6.0",
    "pandas>=2.2",
    "tiktoken>=0.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "streamlit>=1.45",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contractiq"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
